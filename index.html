<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מתקן העברית לוורד</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1d2b4f;
    --muted: #5d6d8c;
    --line: #d5e4fb;
    --blue: #2f6bff;
    --blue-soft: #e7f0ff;
    --sun: #ffd65c;
    --paper: #fffdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    font-family: Fredoka, Arial, sans-serif;
    background:
      radial-gradient(circle at 12% 10%, rgba(120,190,255,.45), transparent 32%),
      radial-gradient(circle at 88% 0%, rgba(255,214,92,.55), transparent 28%),
      linear-gradient(180deg, #f4f9ff, #fff8ea);
  }
  main {
    width: min(680px, calc(100% - 32px));
    margin: 48px auto;
    padding: 36px 32px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 28px;
    box-shadow: 0 18px 50px rgba(47, 107, 255, .08);
  }
  h1 { margin: 0 0 8px; font-size: 40px; line-height: 1.15; }
  .lede { margin: 0; color: var(--muted); font-size: 20px; line-height: 1.45; }
  ul { margin: 22px 0 0; padding: 0 18px 0 0; font-size: 18px; }
  li { margin: 6px 0; }
  form { margin-top: 28px; }
  .drop {
    display: grid;
    place-items: center;
    gap: 8px;
    min-height: 180px;
    padding: 24px;
    border: 2px dashed #9db7ef;
    border-radius: 22px;
    background: var(--blue-soft);
    text-align: center;
    cursor: pointer;
  }
  .drop.over { border-color: var(--blue); background: #fff; }
  .drop strong { font-size: 22px; }
  .drop span { color: var(--muted); font-size: 16px; }
  input { display: none; }
  button {
    margin-top: 16px;
    width: 100%;
    border: 0;
    border-radius: 16px;
    padding: 16px 18px;
    background: var(--sun);
    color: var(--ink);
    font: 700 20px Fredoka, Arial, sans-serif;
    cursor: pointer;
  }
  button:disabled { cursor: not-allowed; opacity: .45; }
  .status, .warnings { margin-top: 18px; font-size: 18px; }
  .warnings { padding: 14px 16px; border-radius: 16px; background: #fff6d8; }
  .warnings p { margin: 8px 0; }
  a.download {
    display: block;
    margin-top: 16px;
    padding: 16px 18px;
    border-radius: 16px;
    background: var(--blue);
    color: white;
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    text-decoration: none;
  }
  .note { margin: 22px 0 0; color: var(--muted); font-size: 15px; }
  .error { color: #9a3412; }
</style>
</head>
<body>
<main>
  <h1>מתקן העברית לוורד</h1>
  <p class="lede">צ׳אט ג׳יפיטי הוציא קובץ וורד והעברית יצאה הפוכה? בוחרים את הקובץ ומקבלים קובץ מתוקן.</p>
  <ul>
    <li>האותיות חוזרות לכיוון הנכון</li>
    <li>מספרים, נקודות וסוגריים נכנסים למקום</li>
    <li>תבליטים עוברים לצד ימין</li>
  </ul>
  <form id="form">
    <label class="drop" id="drop">
      <strong>בחרו קובץ וורד</strong>
      <span id="chosen">אפשר גם לגרור את הקובץ לכאן. רק קובץ docx.</span>
      <input id="file" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
    </label>
    <button id="go" type="submit" disabled>תקנו את הקובץ</button>
  </form>
  <div class="status" id="status" aria-live="polite"></div>
  <p class="note">התיקון קורה אצלכם בדפדפן. הקובץ לא נשלח לאינטרנט.</p>
</main>
<script src="vendor/jszip.min.js"></script>
<script src="fix.js"></script>
<script>
const fileInput = document.querySelector('#file');
const chosen = document.querySelector('#chosen');
const button = document.querySelector('#go');
const status = document.querySelector('#status');
const drop = document.querySelector('#drop');

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  chosen.textContent = file ? file.name : 'אפשר גם לגרור את הקובץ לכאן. רק קובץ docx.';
  button.disabled = !file;
  status.replaceChildren();
});

['dragover', 'dragenter'].forEach((name) => drop.addEventListener(name, (event) => {
  event.preventDefault();
  drop.classList.add('over');
}));
['dragleave', 'drop'].forEach((name) => drop.addEventListener(name, (event) => {
  event.preventDefault();
  drop.classList.remove('over');
}));
drop.addEventListener('drop', (event) => {
  if (!event.dataTransfer.files.length) return;
  fileInput.files = event.dataTransfer.files;
  fileInput.dispatchEvent(new Event('change'));
});

document.querySelector('#form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const file = fileInput.files[0];
  if (!file) return;
  if (!file.name.toLowerCase().endsWith('.docx')) {
    status.className = 'status error';
    status.textContent = 'צריך קובץ וורד חדש, עם הסיומת docx.';
    return;
  }
  if (file.size > 20 * 1024 * 1024) {
    status.className = 'status error';
    status.textContent = 'הקובץ גדול מדי. אפשר עד 20 מגה.';
    return;
  }
  button.disabled = true;
  status.className = 'status';
  status.textContent = 'מתקנים את הקובץ...';
  try {
    const result = await HebrewFix.fixDocx(await file.arrayBuffer());
    status.replaceChildren();
    if (!result.ok) {
      status.className = 'status error';
      status.textContent = result.error;
      button.disabled = false;
      return;
    }
    const url = URL.createObjectURL(new Blob([result.bytes], {
      type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
    }));
    status.className = 'status';
    status.textContent = 'הקובץ מוכן.';
    const link = document.createElement('a');
    link.className = 'download';
    link.href = url;
    link.download = file.name.replace(/\.docx$/i, '') + '-מתוקן.docx';
    link.textContent = 'הורידו את הקובץ המתוקן';
    status.append(link);
    if (result.warnings.length) {
      const box = document.createElement('div');
      box.className = 'warnings';
      const title = document.createElement('strong');
      title.textContent = 'יש כמה שורות שכדאי לבדוק בעין:';
      box.append(title);
      result.warnings.forEach((warning) => {
        const line = document.createElement('p');
        line.textContent = warning.text + ' ' + warning.reasons.join(' ');
        box.append(line);
      });
      status.append(box);
    }
  } catch (error) {
    status.className = 'status error';
    status.textContent = 'לא הצלחנו לתקן את הקובץ. ודאו שזה קובץ וורד רגיל.';
  }
  button.disabled = false;
});
</script>
</body>
</html>
